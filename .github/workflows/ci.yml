name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo fmt --check
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - if: runner.os != 'Windows'
        run: sh -n scripts/*.sh
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $tokens = $null
            $fileErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$fileErrors) | Out-Null
            $errors += $fileErrors
          }
          if ($errors.Count) { $errors | Format-List; exit 1 }

  android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: aarch64-linux-android
            linker: aarch64-linux-android24-clang
          - target: x86_64-linux-android
            linker: x86_64-linux-android24-clang
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ matrix.target }}
      - name: Configure Android toolchain
        shell: bash
        run: |
          toolchain="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          linker="$toolchain/${{ matrix.linker }}"
          test -x "$linker"
          cargo_key=$(printf '%s' '${{ matrix.target }}' | tr '[:lower:]-' '[:upper:]_')
          cc_key=$(printf '%s' '${{ matrix.target }}' | tr '-' '_')
          echo "CARGO_TARGET_${cargo_key}_LINKER=$linker" >> "$GITHUB_ENV"
          echo "CC_${cc_key}=$linker" >> "$GITHUB_ENV"
          echo "AR_${cc_key}=$toolchain/llvm-ar" >> "$GITHUB_ENV"
      - run: cargo build --locked --target '${{ matrix.target }}' --bin workbench
