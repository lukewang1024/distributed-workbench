name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to publish
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
          - runner: ubuntu-latest
            target: aarch64-linux-android
            android_linker: aarch64-linux-android24-clang
          - runner: ubuntu-latest
            target: x86_64-linux-android
            android_linker: x86_64-linux-android24-clang
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ matrix.target }}
      - name: Install musl C toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Configure Android linker
        if: endsWith(matrix.target, '-linux-android')
        shell: bash
        run: |
          linker="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.android_linker }}"
          test -x "$linker"
          key=$(printf '%s' '${{ matrix.target }}' | tr '[:lower:]-' '[:upper:]_')
          echo "CARGO_TARGET_${key}_LINKER=$linker" >> "$GITHUB_ENV"
          cc_key=$(printf '%s' '${{ matrix.target }}' | tr '-' '_')
          echo "CC_${cc_key}=$linker" >> "$GITHUB_ENV"
          echo "AR_${cc_key}=$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" >> "$GITHUB_ENV"
      - name: Resolve version
        id: version
        shell: bash
        run: |
          tag='${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}'
          case "$tag" in v*) ;; *) echo 'release tag must start with v' >&2; exit 2;; esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          workspace_version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' Cargo.toml)
          test "$workspace_version" = "${tag#v}" || {
            echo "tag version ${tag#v} does not match workspace $workspace_version" >&2
            exit 2
          }
      - name: Build release binaries
        shell: bash
        run: |
          if [[ '${{ matrix.target }}' == *-linux-android ]]; then
            cargo build --release --locked --target '${{ matrix.target }}' --bin workbench
          else
            cargo build --release --locked --target '${{ matrix.target }}' --bins
          fi
      - name: Package release archive
        shell: bash
        run: >-
          scripts/package-release.sh
          '${{ steps.version.outputs.version }}'
          '${{ matrix.target }}'
          'target/${{ matrix.target }}/release'
          dist
      - uses: actions/upload-artifact@v7
        with:
          name: distributed-workbench-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums
        working-directory: dist
        run: sha256sum distributed-workbench-* > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "distributed-workbench $TAG"
