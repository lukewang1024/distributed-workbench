[package]
name = "workbench-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
base64.workspace = true
flate2.workspace = true
hex.workspace = true
interprocess.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
thiserror.workspace = true
tungstenite.workspace = true
uuid.workspace = true
workbench-core = { path = "../workbench-core" }
workbench-protocol = { path = "../workbench-protocol" }
workbench-schema = { path = "../workbench-schema" }

[target.'cfg(windows)'.dependencies]
junction = "1.2"
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_Environment", "Win32_System_RemoteDesktop", "Win32_System_Threading"] }
widestring = "1.2"

[dev-dependencies]
tempfile.workspace = true
